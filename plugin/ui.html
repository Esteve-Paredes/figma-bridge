<style>
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 0; padding: 16px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--figma-color-border, #ccc); border-radius: 6px; font: inherit; color: inherit; background: transparent; }
  .hint { color: var(--figma-color-text-secondary, #666); margin: 6px 0 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button { padding: 7px 14px; border-radius: 6px; font: inherit; cursor: pointer; border: 1px solid var(--figma-color-border, #ccc); background: transparent; color: inherit; }
  button.primary { background: #0d99ff; border-color: #0d99ff; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
<label for="col">Colección (carpeta del módulo)</label>
<input id="col" autofocus autocomplete="off" />
<div class="hint" id="hint">Cargando…</div>
<div class="row">
  <button id="cancel">Cancelar</button>
  <button id="go" class="primary" disabled>Exportar</button>
</div>
<script>
  let data = null;
  const $ = (id) => document.getElementById(id);

  const slug = (s) =>
    String(s)
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "-")
      .replace(/^-|-$/g, "")
      .toLowerCase();

  const send = (m) => parent.postMessage({ pluginMessage: m }, "*");

  // El PNG exportado por Figma es transparente (se veria negro): se pinta sobre fondo blanco antes de enviarlo.
  function conFondo(b64) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = img.width;
        c.height = img.height;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0);
        resolve(c.toDataURL("image/png").split(",")[1]);
      };
      img.onerror = () => resolve(b64);
      img.src = "data:image/png;base64," + b64;
    });
  }

  function refrescar() {
    const s = slug($("col").value);
    $("go").disabled = !data || !s;
    $("hint").textContent = s
      ? "Se guarda en exports/" + s + "/ (" + (data ? data.items.length : 0) + " vista(s))"
      : "Escribe un nombre de colección";
  }

  async function exportar() {
    const coleccion = slug($("col").value);
    if (!coleccion || !data) return;
    $("go").disabled = true;
    $("hint").textContent = "Enviando…";
    send({ type: "remember", value: $("col").value.trim() });
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    try {
      for (const item of data.items) if (item.png) item.png = await conFondo(item.png);
      const res = await fetch("http://localhost:3855/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file: data.file, page: data.page, coleccion, items: data.items }),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      send({ type: "done", saved: json.saved, coleccion: json.coleccion });
    } catch (e) {
      console.log("[bridge-ui] error", e);
      send({ type: "error", message: String(e.message || e) + " (¿está corriendo node server.js?)" });
    } finally {
      clearTimeout(timer);
    }
  }

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || msg.type !== "init") return;
    data = msg.payload;
    // La sugerencia puede ser el nombre de pagina crudo ("🟡 Módulo checkout") o un nombre ya recordado: se muestra ya limpio.
    $("col").value = slug(data.coleccionSugerida);
    refrescar();
    $("col").focus();
    $("col").select();
  };

  $("col").addEventListener("input", refrescar);
  $("col").addEventListener("keydown", (e) => {
    if (e.key === "Enter") exportar();
    if (e.key === "Escape") send({ type: "cancel" });
  });
  $("go").addEventListener("click", exportar);
  $("cancel").addEventListener("click", () => send({ type: "cancel" }));
  send({ type: "ready" });
</script>
